<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1D3A">
  <meta name="description" content="PMersion. Piloter. Décider. Progresser. Une nouvelle expérience de gestion de projet arrive bientôt.">
  <title>PMersion | Bientôt disponible</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{--navy:#0B1D3A;--teal:#00A8B5;--blue:#1967D2;--white:#fff;--muted:#9fb0c8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--navy);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative}
    body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 28% 35%,rgba(25,103,210,.23),transparent 28%),radial-gradient(circle at 72% 64%,rgba(0,168,181,.18),transparent 25%);animation:drift 14s ease-in-out infinite alternate}
    .grid{position:fixed;inset:0;opacity:.11;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,transparent,black 22%,black 78%,transparent)}
    main{position:relative;z-index:2;width:min(860px,92vw);text-align:center;padding:48px 22px}
    .logo{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:32px;opacity:0;transform:translateY(14px);animation:enter .8s .12s cubic-bezier(.2,.8,.2,1) forwards}
    .mark{width:76px;height:76px;filter:drop-shadow(0 14px 35px rgba(0,0,0,.24))}
    .wordmark{font-size:clamp(2rem,5vw,3rem);font-weight:780;letter-spacing:-.045em}
    .wordmark .p{color:var(--blue)} .wordmark .m{color:var(--teal)}
    .eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);border-radius:999px;padding:8px 13px;color:#c7d4e5;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:0;animation:enter .75s .28s forwards}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(0,168,181,.55);animation:pulse 2.2s infinite}
    h1{font-size:clamp(2.8rem,8vw,6.2rem);line-height:.98;letter-spacing:-.065em;margin:27px auto 20px;max-width:800px;opacity:0;transform:translateY(20px);animation:enter .85s .38s cubic-bezier(.2,.8,.2,1) forwards}
    h1 span{background:linear-gradient(100deg,#fff 20%,#b8d9ff 54%,#8fe6ea);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{max-width:610px;margin:0 auto;color:var(--muted);font-size:clamp(1rem,2.5vw,1.22rem);line-height:1.7;opacity:0;animation:enter .8s .54s forwards}
    .line{width:min(410px,72vw);height:1px;margin:38px auto 22px;background:linear-gradient(90deg,transparent,var(--blue),var(--teal),transparent);position:relative;overflow:visible;opacity:0;animation:enter .7s .68s forwards}
    .line:after{content:"";position:absolute;top:-2px;left:0;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 18px rgba(255,255,255,.9);animation:scan 4.4s 1.1s ease-in-out infinite}
    .tagline{font-size:.79rem;text-transform:uppercase;letter-spacing:.24em;font-weight:700;color:#dbe7f5;opacity:0;animation:enter .7s .75s forwards}
    footer{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:#70839e;font-size:.72rem;letter-spacing:.04em;z-index:2}
    @keyframes enter{to{opacity:1;transform:translateY(0)}}
    @keyframes drift{to{transform:translate3d(3%,2%,0) scale(1.06)}}
    @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(0,168,181,0)}100%{box-shadow:0 0 0 0 rgba(0,168,181,0)}}
    @keyframes scan{0%,100%{left:0;opacity:0}10%,90%{opacity:1}50%{left:100%}}
    @media(max-width:540px){.logo{gap:13px}.mark{width:61px;height:61px}.wordmark{font-size:2rem}main{padding-top:24px}.tagline{letter-spacing:.16em}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.logo,.eyebrow,h1,.lead,.line,.tagline{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main>
    <div class="logo" aria-label="PMersion">
      <svg class="mark" viewBox="0 0 88 88" role="img" aria-label="Logo PMersion">
        <rect x="4" y="4" width="80" height="80" rx="22" fill="#07162d" stroke="rgba(255,255,255,.12)"/>
        <path d="M24 23h16c10 0 17 5.8 17 15s-7 15-17 15h-7v13h-9V23zm9 8v14h7c5 0 8-2.4 8-7s-3-7-8-7h-7z" fill="#1967D2"/>
        <path d="M48 52l8-13 8 13 8-13v27h-8V52l-8 13-8-13v14h-8V39z" fill="#00A8B5" opacity=".98"/>
        <path d="M44 72l-5-7h10z" fill="#fff" opacity=".92"/>
        <circle cx="18" cy="20" r="2.3" fill="#1967D2"/><circle cx="70" cy="20" r="2.3" fill="#00A8B5"/>
      </svg>
      <div class="wordmark"><span class="p">P</span>Mersion</div>
    </div>
    <div class="eyebrow"><span class="dot"></span> En préparation</div>
    <h1><span>La gestion de projet, vécue.</span></h1>
    <p class="lead">PMersion prépare une expérience immersive pour piloter, décider et progresser au cœur de projets réels.</p>
    <div class="line" aria-hidden="true"></div>
    <div class="tagline">Piloter · Décider · Progresser</div>
  </main>
  <footer>© 2026 PMersion · Ouverture prochaine</footer>
</body>
</html>

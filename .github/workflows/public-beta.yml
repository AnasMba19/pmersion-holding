name: Public Beta Verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    # The 320-case source suite took 12 minutes; this bundle runs 384 cases.
    # Bound the job without changing test timeouts, assertions or retries.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Use the official HTTPS Ubuntu mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install browser dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium
      - name: Identify the published workspace generation
        id: generation
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("public-release.json")); const [major,minor]=m.version.split(".").map(Number); fs.appendFileSync(process.env.GITHUB_OUTPUT, "direction_d="+(major > 0 || minor >= 18)+"\n");'
      - id: public_tests
        run: |
          if [[ "${{ steps.generation.outputs.direction_d }}" == 'true' ]]; then
            npx playwright test tests/published-d.spec.mjs
          else
            npm test
          fi
      - name: Preserve bounded public viewport evidence in checksummed logs
        if: always() && steps.generation.outputs.direction_d != 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_OUTCOME: ${{ steps.public_tests.outcome }}
        run: python3 ci/emit-evidence.py emit --kind workshop --root test-results --source "$SOURCE_SHA" --outcome "$TEST_OUTCOME"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.generation.outputs.direction_d != 'true' && vars.PMERSION_ARCHIVE_FULL_EVIDENCE == 'true' }}
        with:
          name: public-beta-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.generation.outputs.direction_d != 'true' && vars.PMERSION_ARCHIVE_FULL_EVIDENCE == 'true' }}
        with:
          name: public-workspace-views-${{ github.sha }}
          path: test-results/**/*.png
          retention-days: 14
          if-no-files-found: error

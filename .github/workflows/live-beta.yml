name: Published Beta Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Use the official HTTPS Ubuntu mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install the tested headless browser
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium
      - id: live_tests
        run: npx playwright test --config live-tests/playwright.config.mjs
      - name: Preserve published-domain test provenance
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          TEST_OUTCOME: ${{ steps.live_tests.outcome }}
        run: python3 ci/emit-evidence.py emit --kind browser --root test-results/live-beta --source "$SOURCE_SHA" --outcome "$TEST_OUTCOME"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && vars.PMERSION_ARCHIVE_FULL_EVIDENCE == 'true' }}
        with:
          name: published-beta-proof-${{ github.sha }}
          path: |
            test-results/live-beta/
            live-beta-report/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && vars.PMERSION_ARCHIVE_FULL_EVIDENCE == 'true' }}
        with:
          name: published-beta-views-${{ github.sha }}
          path: test-results/live-beta/**/*.png
          retention-days: 14
          if-no-files-found: error
